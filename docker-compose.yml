services:
  whatsapp-bridge:
    build: .
    container_name: whatsapp-bridge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # Interactive first run to scan the QR code:
    #   docker compose run --rm whatsapp-bridge
    # Then start detached:
    #   docker compose up -d whatsapp-bridge
    stdin_open: true
    tty: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp-mcp:
    build: .
    container_name: whatsapp-mcp
    restart: unless-stopped
    env_file: .env
    command: ["node", "src/mcp.js"]
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "3333"
    volumes:
      - ./data:/app/data
    # Bound to localhost on the droplet only. Reach it with an SSH tunnel.
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      - whatsapp-bridge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
